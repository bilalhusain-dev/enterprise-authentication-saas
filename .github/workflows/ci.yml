name: CI / Production Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Build, Lint & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Automated Security Smoke Tests
        run: npm test

      - name: TypeScript Type Safety Check
        run: npm run typecheck

      - name: ESLint Code Quality Verification
        run: npm run lint
        env:
          CI: false
        continue-on-error: true
